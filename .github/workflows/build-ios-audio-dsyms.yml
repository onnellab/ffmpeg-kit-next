name: Build iOS audio XCFrameworks with dSYMs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out pinned source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41

      - name: Verify immutable source routing
        shell: bash
        run: |
          set -euo pipefail
          tools/apple/test-source-pin-routing.sh
          tools/apple/test-ffmpeg-version-helpers.sh
          tools/apple/test-ios-audio-compliance-contract.sh
          tools/apple/test-dsym-lifecycle.sh
          nix develop .#xcode26 -c bash -c 'command -v autogen'

      - name: Build the Melivra audio profile
        shell: bash
        run: |
          set -euo pipefail
          build_status=0
          ./nix-ios.sh -p xcode26 -x --dsym --jobs=3 \
            --target=12.1 \
            --disable-arm64e \
            --disable-arm64-mac-catalyst \
            --disable-x86-64-mac-catalyst \
            --enable-lame \
            --enable-libilbc \
            --enable-libvorbis \
            --enable-opencore-amr \
            --enable-opus \
            --enable-shine \
            --enable-soxr \
            --enable-speex \
            --enable-twolame \
            --enable-vo-amrwbenc \
            --enable-ios-zlib \
            --enable-ios-libiconv || build_status=$?

          if [[ -f build.log ]]; then
            tools/apple/sanitize-build-log.sh build.log build-diagnostics.log
            tail -n 500 build-diagnostics.log || true
          fi
          exit "${build_status}"

      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffmpeg-kit-next-ios-build-diagnostics
          path: build-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify frameworks and dSYMs
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$(find prebuilt -mindepth 1 -maxdepth 1 -type d -name 'bundle-apple-xcframework-ios-*' -print -quit)"
          test -n "${bundle_dir}"
          tools/apple/verify-xcframework-dsyms.sh "${bundle_dir}"

          if grep -En -- '--enable-(gpl|nonfree)|enable-(x264|x265|xvidcore|libvidstab|rubberband)' build.log; then
            echo 'error: GPL or non-free configuration detected' >&2
            exit 1
          fi

          mkdir -p dist
          tools/apple/sanitize-build-log.sh build.log dist/build.log
          cp flake.lock LICENSE scripts/source.sh dist/
          git rev-parse HEAD > dist/source-commit.txt
          xcodebuild -version > dist/xcode-version.txt
          sw_vers > dist/macos-version.txt
          xcrun --sdk iphoneos --show-sdk-version > dist/iphoneos-sdk-version.txt
          ditto -c -k --sequesterRsrc --keepParent "${bundle_dir}" dist/ffmpeg-kit-next-8.1.1-audio-ios-dsyms.zip
          tools/apple/package-ios-audio-compliance.sh src .tmp "${bundle_dir}" dist/ffmpeg-kit-next-8.1.1-audio-source
          ditto -c -k --sequesterRsrc --keepParent dist/ffmpeg-kit-next-8.1.1-audio-source dist/ffmpeg-kit-next-8.1.1-audio-source.zip
          shasum -a 256 dist/ffmpeg-kit-next-8.1.1-audio-ios-dsyms.zip > dist/SHA256SUMS
          shasum -a 256 dist/ffmpeg-kit-next-8.1.1-audio-source.zip >> dist/SHA256SUMS
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "ci_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "xcode=$(tr '\n' ' ' < dist/xcode-version.txt)"
            echo "iphoneos_sdk=$(cat dist/iphoneos-sdk-version.txt)"
            cat dist/SHA256SUMS
          } > dist/PROVENANCE.txt
          cp dist/ffmpeg-kit-next-8.1.1-audio-source/UUID-MANIFEST.tsv dist/

      - name: Upload verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffmpeg-kit-next-8.1.1-audio-ios-dsyms
          path: dist/
          if-no-files-found: error
          retention-days: 30
